name: Feature request
description: Suggest an idea for gh-clip
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: What are you trying to do that gh-clip doesn't support today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the command/flag/config look like, ideally?

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
